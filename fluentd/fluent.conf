<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match app.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix app
  include_tag_key true
  type_name access_log
  tag_key @log_name
  flush_interval 1s
</match>

<match **>
  @type file
  path /fluentd/log/data.*.log
  compress gzip
  <buffer>
    timekey 1d
    timekey_use_utc true
    timekey_wait 10m
  </buffer>
</match> 